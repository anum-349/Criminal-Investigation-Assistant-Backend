services:
  postgres:
    image: postgres:16-alpine
    container_name: cia-postgres
    environment:
      POSTGRES_DB: cia_db
      POSTGRES_USER: cia_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-insecure_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cia_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cia-backend
    environment:
      DATABASE_URL: postgresql://cia_user:${DB_PASSWORD:-insecure_dev_password}@postgres:5432/cia_db
      RUN_MIGRATIONS: "true"
      PYTHONUNBUFFERED: "1"
      GROQ_FIR_API_KEY: ${GROQ_FIR_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - uploads:/app/uploads
      - backups:/app/backups
      - sqlite_data:/app/sqlite_data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cia-net

volumes:
  postgres_data:
  uploads:
  backups:
  sqlite_data:

networks:
  cia-net:
    driver: bridge
