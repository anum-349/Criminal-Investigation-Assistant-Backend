services:
  postgres:
    image: postgres:16-alpine
    container_name: cia-postgres
    environment:
      POSTGRES_DB: criminal_investigation_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aqdus102
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d criminal_investigation_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cia-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cia-backend
    environment:
      DATABASE_URL: postgresql://postgres:aqdus102@postgres:5432/criminal_investigation_assistant
      RUN_MIGRATIONS: "false"
      PYTHONUNBUFFERED: "1"
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - uploads:/app/uploads
      - backups:/app/backups
      - sqlite_data:/app/sqlite_data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cia-net

volumes:
  postgres_data:
  uploads:
  backups:
  sqlite_data:

networks:
  cia-net:
    driver: bridge
